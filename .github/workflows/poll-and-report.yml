name: Poll and Report

on:
  schedule:
    # Every 3 hours, at 00:00 / 03:00 / 06:00 / ... UTC.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log the Google Chat payload instead of posting it"
        type: boolean
        default: false

permissions:
  contents: write

# Serialize runs so a manual dispatch cannot race the scheduled run on the state push.
concurrency:
  group: poll-and-report
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Poll repos and report
        run: node dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state/state.json; then
            git config user.name "cpk-agui-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/state.json
            git commit -m "chore: update poll state [skip ci]"
            git push
          else
            echo "state unchanged"
          fi
